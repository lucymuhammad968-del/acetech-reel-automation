name: Post to Instagram
on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: post-reel
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Keep posting due items on time
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          git config user.name reels-bot
          git config user.email reels-bot@users.noreply.github.com
          end=$((SECONDS+20400))
          while [ $SECONDS -lt $end ]; do
            git pull --rebase -q || true
            python post_reel.py || true
            (git add -A queue.csv media 2>/dev/null || git add -A queue.csv)
            git diff --cached --quiet || (git commit -q -m "Update queue status" && git push -q || (git pull --rebase -q && git push -q)) || true
            sleep 40
          done
